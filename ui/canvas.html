<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSA AI Agent V5.0 - Anti-Gravity Spatial Workspace</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Outfit -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at top right, #0d122b, #050714);
      overflow: hidden;
      margin: 0;
    }
    .glass-canvas {
      backdrop-filter: blur(25px) saturate(180%);
      background: rgba(10, 15, 30, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .spatial-card {
      position: absolute;
      cursor: grab;
      backdrop-filter: blur(30px);
      background: rgba(16, 22, 46, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
    }
    .spatial-card:active {
      cursor: grabbing;
      box-shadow: 0 30px 60px rgba(99, 102, 241, 0.3);
      border-color: rgba(99, 102, 241, 0.5);
    }
    .pulse-avatar {
      animation: pulse-glow 3s infinite ease-in-out;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); transform: scale(1); }
      50% { box-shadow: 0 0 25px rgba(99, 102, 241, 0.8); transform: scale(1.05); }
    }
  </style>
</head>
<body class="w-screen h-screen relative select-none">

  <!-- Spatial board grid lines -->
  <div class="absolute inset-0 bg-[linear-gradient(rgba(255,255,255,0.02)_1px,transparent_1px),linear-gradient(90deg,rgba(255,255,255,0.02)_1px,transparent_1px)] bg-[size:40px_40px] pointer-events-none"></div>

  <!-- Header Ambient OS Control bar -->
  <header class="absolute top-4 left-4 right-4 h-14 glass-canvas rounded-2xl flex items-center justify-between px-6 z-50">
    <div class="flex items-center gap-3">
      <div class="w-4 h-4 rounded-full bg-indigo-500 pulse-avatar"></div>
      <span class="text-sm font-bold text-white tracking-wider">MSA AI AGENT V5.0</span>
      <span class="px-2 py-0.5 bg-indigo-950 border border-indigo-500/30 rounded text-[9px] font-bold text-indigo-400">ANTI-GRAVITY OS</span>
    </div>
    <div class="flex items-center gap-4 text-xs text-zinc-400 font-medium">
      <span id="gateway-status">Gateway: Connecting...</span>
      <div id="conn-dot" class="w-2 h-2 rounded-full bg-rose-500"></div>
    </div>
  </header>

  <!-- Infinite Canvas Area -->
  <main id="spatial-canvas" class="w-full h-full relative overflow-hidden">

    <!-- Card 1: Draggable AI Agent Avatar Constellation -->
    <div id="card-avatar" class="spatial-card w-72 p-6 rounded-2xl z-20" style="top: 100px; left: 80px;">
      <div class="flex items-center justify-between border-b border-zinc-800 pb-3 mb-4 drag-handle">
        <span class="text-xs uppercase font-extrabold tracking-wider text-zinc-400">Cognitive Core</span>
        <div class="w-2.5 h-2.5 rounded-full bg-indigo-500"></div>
      </div>
      <div class="flex flex-col items-center py-4">
        <div class="w-20 h-20 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center pulse-avatar font-bold text-white text-3xl">
          M
        </div>
        <h3 class="text-white text-sm font-bold mt-4">MSA Agentic Swarm</h3>
        <p class="text-[10px] text-zinc-400 mt-1 uppercase tracking-wide">LangGraph Orchestrator</p>
      </div>
    </div>

    <!-- Card 2: Interactive Chat Stream Output -->
    <div id="card-chat" class="spatial-card w-[450px] h-[360px] flex flex-col rounded-2xl z-20" style="top: 100px; left: 400px;">
      <div class="flex justify-between items-center px-5 py-3 border-b border-zinc-800/80 drag-handle">
        <span class="text-xs uppercase font-extrabold tracking-wider text-zinc-400">Active Pipeline Stream</span>
        <button onclick="clearChat()" class="text-[10px] hover:text-white text-zinc-500 transition-colors uppercase font-bold">Clear</button>
      </div>
      <!-- Messages logs -->
      <div id="chat-stream-box" class="flex-1 p-5 overflow-y-auto space-y-4 font-sans text-xs text-zinc-300 leading-relaxed scrollbar-thin">
        <div class="p-3.5 rounded-xl bg-zinc-950/40 border border-zinc-800/80">
          Hello! Submit a query to see the V5.0 LangGraph cyclic orchestration and token streaming pipelines.
        </div>
      </div>
    </div>

    <!-- Card 3: System Telemetry Monitor -->
    <div id="card-telemetry" class="spatial-card w-72 p-5 rounded-2xl z-20" style="top: 260px; left: 80px;">
      <div class="flex justify-between items-center border-b border-zinc-800 pb-3 mb-4 drag-handle">
        <span class="text-xs uppercase font-extrabold tracking-wider text-zinc-400">System Telemetry</span>
        <span class="text-[10px] text-indigo-400 font-bold">LIVE</span>
      </div>
      <div class="space-y-3.5">
        <div class="space-y-1">
          <div class="flex justify-between text-[10px] text-zinc-400"><span>CPU Core Load</span><span id="tel-cpu">0%</span></div>
          <div class="w-full h-1 bg-zinc-950 rounded-full overflow-hidden">
            <div id="bar-cpu" class="h-full bg-indigo-500 transition-all duration-300" style="width:0%"></div>
          </div>
        </div>
        <div class="space-y-1">
          <div class="flex justify-between text-[10px] text-zinc-400"><span>RAM Allocation</span><span id="tel-ram">0%</span></div>
          <div class="w-full h-1 bg-zinc-950 rounded-full overflow-hidden">
            <div id="bar-ram" class="h-full bg-purple-500 transition-all duration-300" style="width:0%"></div>
          </div>
        </div>
      </div>
    </div>

  </main>

  <!-- Bottom Floating Command Composer Palette -->
  <footer class="absolute bottom-6 left-1/2 -translate-x-1/2 w-[550px] glass-canvas rounded-2xl p-3 flex gap-3 items-center z-50">
    <button onclick="startVoice()" class="w-10 h-10 rounded-xl bg-zinc-900/60 border border-zinc-800 flex items-center justify-center hover:bg-zinc-800 transition-colors text-lg" id="voice-btn">🎤</button>
    <input type="text" id="cmd-composer" placeholder="Ask MSA Agent anything (Ctrl+K to toggle overlay)..." class="flex-1 bg-transparent border-0 outline-none text-xs text-white placeholder-zinc-500 font-medium px-2">
    <button onclick="sendComposerCommand()" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 transition-colors text-white font-bold text-xs">Execute</button>
  </footer>

  <!-- Spatial Javascript Engine -->
  <script>
    // 1. Draggable Card Mechanics
    const cards = document.querySelectorAll('.spatial-card');
    let activeCard = null;
    let offset = [0,0];

    cards.forEach(card => {
      const handle = card.querySelector('.drag-handle') || card;
      handle.addEventListener('mousedown', (e) => {
        activeCard = card;
        // Raise active card z-index
        cards.forEach(c => c.style.zIndex = 20);
        card.style.zIndex = 30;
        
        offset = [
          card.offsetLeft - e.clientX,
          card.offsetTop - e.clientY
        ];
      });
    });

    document.addEventListener('mouseup', () => {
      activeCard = null;
    });

    document.addEventListener('mousemove', (e) => {
      if (activeCard) {
        e.preventDefault();
        activeCard.style.left = (e.clientX + offset[0]) + 'px';
        activeCard.style.top = (e.clientY + offset[1]) + 'px';
      }
    });

    // 2. WebSocket gateway connection
    let ws;
    const wsUrl = `ws://${window.location.hostname}:8000/api/v5/ws`;

    function connectWs() {
      ws = new WebSocket(wsUrl);
      
      ws.onopen = () => {
        document.getElementById('gateway-status').textContent = 'Gateway: Online';
        const dot = document.getElementById('conn-dot');
        dot.className = 'w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]';
      };

      ws.onclose = () => {
        document.getElementById('gateway-status').textContent = 'Gateway: Disconnected';
        const dot = document.getElementById('conn-dot');
        dot.className = 'w-2 h-2 rounded-full bg-rose-500';
        setTimeout(connectWs, 5000); // retry
      };

      let streamingPara = null;
      let accumulated = "";

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        const box = document.getElementById('chat-stream-box');

        if (data.type === 'status') {
          // Show active pipeline status
          const statDiv = document.createElement('div');
          statDiv.className = 'text-[9px] uppercase font-bold tracking-widest text-indigo-400 animate-pulse';
          statDiv.textContent = `✦ [${data.state}] ${data.message}`;
          box.appendChild(statDiv);
          box.scrollTop = box.scrollHeight;
        } 
        else if (data.type === 'token') {
          if (!streamingPara) {
            streamingPara = document.createElement('p');
            streamingPara.className = 'p-3 rounded-xl bg-zinc-900 border border-zinc-800 text-white font-mono leading-relaxed';
            box.appendChild(streamingPara);
          }
          accumulated += data.content;
          streamingPara.innerHTML = parseMarkdown(accumulated) + '<span class="inline-block w-1.5 h-3 bg-indigo-400 ml-1 animate-pulse"></span>';
          box.scrollTop = box.scrollHeight;
        }
        else if (data.type === 'completed') {
          if (streamingPara) {
            // Remove cursor
            streamingPara.innerHTML = parseMarkdown(data.response);
          } else {
            const finalDiv = document.createElement('div');
            finalDiv.className = 'p-3 rounded-xl bg-zinc-900 border border-zinc-800 text-white';
            finalDiv.innerHTML = parseMarkdown(data.response);
            box.appendChild(finalDiv);
          }
          streamingPara = null;
          accumulated = "";
          box.scrollTop = box.scrollHeight;
        }
      };
    }

    function parseMarkdown(txt) {
      // Basic markdown replacement
      return txt
        .replace(/`([^`]+)`/g, '<code class="bg-black/60 px-1 py-0.5 rounded text-rose-300 font-mono text-[10px]">$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    }

    function sendComposerCommand() {
      const inp = document.getElementById('cmd-composer');
      const val = inp.value.trim();
      if (!val || !ws || ws.readyState !== WebSocket.OPEN) return;
      
      // Emit command to ws
      ws.send(JSON.stringify({ command: val }));
      
      // Append user query card to UI
      const box = document.getElementById('chat-stream-box');
      const userDiv = document.createElement('div');
      userDiv.className = 'p-3 rounded-xl bg-zinc-800/40 text-right text-zinc-200 border border-zinc-700/20';
      userDiv.innerHTML = `<span class="text-[9px] uppercase tracking-wider font-bold text-zinc-500">Query</span><p class="mt-1">${val}</p>`;
      box.appendChild(userDiv);
      box.scrollTop = box.scrollHeight;

      inp.value = "";
    }

    function clearChat() {
      document.getElementById('chat-stream-box').innerHTML = `
        <div class="p-3.5 rounded-xl bg-zinc-950/40 border border-zinc-800/80">
          Workspace cleared. Ready.
        </div>
      `;
    }

    // Connect on load
    connectWs();

    // 3. Simulated hardware telemetry update
    setInterval(() => {
      const cpu = Math.floor(Math.random() * 12) + 2;
      const ram = Math.floor(Math.random() * 5) + 38;
      document.getElementById('tel-cpu').textContent = cpu + '%';
      document.getElementById('tel-ram').textContent = ram + '%';
      document.getElementById('bar-cpu').style.width = cpu + '%';
      document.getElementById('bar-ram').style.width = ram + '%';
    }, 3000);
  </script>
</body>
</html>
