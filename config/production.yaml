# config/production.yaml
# Production environment — override development defaults

app:
  environment: "production"
  debug: false
  log_level: "WARNING"

server:
  flask_host: "127.0.0.1"
  flask_port: 5000
  fastapi_host: "127.0.0.1"
  fastapi_port: 8000
  secret_key: "${MSA_SECRET_KEY}"   # MUST be set via environment variable
  cors_origins: ["http://localhost:5000", "http://localhost:8000"]
  reload: false

database:
  sqlite_path: "data/memory/msa.db"
  postgresql_url: "${DATABASE_URL}"
  redis_url: "${REDIS_URL}"
  redis_ttl_seconds: 7200

ollama:
  base_url: "${OLLAMA_BASE_URL:-http://localhost:11434}"
  default_model: "llama3.2:3b"
  timeout: 180

agent:
  context_window: 15
  max_retries: 5
  retry_delay: 2.0
  stream_timeout: 120
  max_tool_calls: 10
