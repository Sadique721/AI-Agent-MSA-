# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║         MSA AI Agent — Complete Full-Stack Docker Compose                  ║
# ║         Author : Md Sadique Amin (MSA) — V6 Ultra Pro Max                  ║
# ║                                                                              ║
# ║  ⚠  ALL HOST PORTS ARE 10000+ (to avoid conflicts with other stacks)       ║
# ║                                                                              ║
# ║  ┌─────────────────────────────────────────────────────────────────────┐   ║
# ║  │  SERVICE            HOST PORT  →  CONTAINER PORT  │  URL            │   ║
# ║  ├─────────────────────────────────────────────────────────────────────┤   ║
# ║  │  FRONTEND                                                           │   ║
# ║  │  msa-frontend       10080  →  10080   │ http://localhost:10080      │   ║
# ║  │  msa-pwa            10090  →  10090   │ http://localhost:10090      │   ║
# ║  │                                                                     │   ║
# ║  │  BACKEND                                                            │   ║
# ║  │  msa-agent (Flask)  10500  →  5000    │ http://localhost:10500      │   ║
# ║  │  msa-agent (FastAPI)10800  →  8000    │ http://localhost:10800/docs │   ║
# ║  │  msa-gateway        10808  →  8080    │ http://localhost:10808      │   ║
# ║  │  msa-auth           10801  →  8081    │ http://localhost:10801      │   ║
# ║  │  msa-career-api     10802  →  8082    │ http://localhost:10802/docs │   ║
# ║  │  msa-config         10803  →  8083    │ http://localhost:10803      │   ║
# ║  │                                                                     │   ║
# ║  │  AUTOMATION                                                         │   ║
# ║  │  n8n                15678  →  5678    │ http://localhost:15678      │   ║
# ║  │                                                                     │   ║
# ║  │  DATA STORES                                                        │   ║
# ║  │  postgres           15432  →  5432    │ localhost:15432             │   ║
# ║  │  redis              16379  →  6379    │ localhost:16379             │   ║
# ║  │  qdrant (REST)      16333  →  6333    │ http://localhost:16333      │   ║
# ║  │  qdrant (gRPC)      16334  →  6334    │ localhost:16334             │   ║
# ║  │  neo4j (HTTP)       17474  →  7474    │ http://localhost:17474      │   ║
# ║  │  neo4j (Bolt)       17687  →  7687    │ bolt://localhost:17687      │   ║
# ║  │  minio (S3)         19000  →  9000    │ http://localhost:19000      │   ║
# ║  │  minio (Console)    19001  →  9001    │ http://localhost:19001      │   ║
# ║  │                                                                     │   ║
# ║  │  MESSAGING / DISCOVERY                                              │   ║
# ║  │  kafka              19092  →  9092    │ localhost:19092             │   ║
# ║  │  consul (HTTP)      18500  →  8500    │ http://localhost:18500      │   ║
# ║  │  consul (DNS)       18600  →  8600    │ localhost:18600/udp         │   ║
# ║  │  vault              18200  →  8200    │ http://localhost:18200      │   ║
# ║  │                                                                     │   ║
# ║  │  OBSERVABILITY                                                      │   ║
# ║  │  prometheus         19090  →  9090    │ http://localhost:19090      │   ║
# ║  │  grafana            13001  →  3000    │ http://localhost:13001      │   ║
# ║  └─────────────────────────────────────────────────────────────────────┘   ║
# ║                                                                              ║
# ║  NOTE: Ollama runs on HOST → host.docker.internal:11434                    ║
# ║  MANDATORY STARTUP CHAIN:                                                   ║
# ║    ollama-check → msa-llm-init → msa-rag-init → msa-agent                 ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# Quick Start:
#   docker compose up -d --build          # Build + start all services
#   docker compose logs -f msa-agent      # Watch agent logs
#   docker compose ps                     # Check all service health
#   docker compose down                   # Stop (keep volumes)
#   docker compose down -v                # Stop + remove volumes
#
# Development mode (hot-reload, no healthcheck waits):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Production mode (resource limits, hardened config):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d


networks:
  msa-net:
    driver: bridge
    name: msa-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  kafka_data:          # FIX: Kafka data persistence (was missing)
  prometheus_data:
  grafana_data:
  n8n_data:
  msa_data:
  msa_models:
  msa_uploads:
  msa_indexes:

# ═════════════════════════════════════════════════════════════════════════════
# SECTION 1 — DATA INFRASTRUCTURE
# HOST PORTS: 15432 / 16379 / 16333 / 16334 / 17474 / 17687 / 19000 / 19001
# ═════════════════════════════════════════════════════════════════════════════
services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  # Host: 15432  |  Container: 5432 (standard)
  postgres:
    image: postgres:15-alpine
    container_name: msa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: msa_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-msa_secure_password}
      POSTGRES_DB: msa_enterprise
    ports:
      - "127.0.0.1:15432:5432"  # Restricted to localhost — NOT exposed to 0.0.0.0
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msa_admin -d msa_enterprise"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - msa-net

  # ── Redis ─────────────────────────────────────────────────────────────────
  # Host: 16379  |  Container: 6379 (standard)
  redis:
    image: redis:7-alpine
    container_name: msa-redis
    restart: unless-stopped
    command: >
      redis-server
        --appendonly yes
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:16379:6379"  # Restricted to localhost — NOT exposed to 0.0.0.0
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - msa-net

  # ── Qdrant Vector DB ──────────────────────────────────────────────────────
  # Host: 16333 (REST)  16334 (gRPC)  |  Container: 6333 / 6334
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: msa-qdrant
    restart: unless-stopped
    ports:
      - "16333:6333"
      - "16334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/readyz || curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - msa-net

  # ── Neo4j Graph RAG ───────────────────────────────────────────────────────
  # Host: 17474 (HTTP)  17687 (Bolt)  |  Container: 7474 / 7687
  neo4j:
    image: neo4j:5.18-community
    container_name: msa-neo4j
    restart: unless-stopped
    ports:
      - "17474:7474"
      - "17687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-msa_neo4j_pass}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/import
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - msa-net

  # ── MinIO Object Storage ──────────────────────────────────────────────────
  # Host: 19000 (S3 API)  19001 (Console)  |  Container: 9000 / 9001
  minio:
    image: minio/minio:RELEASE.2024-05-01T01-11-10Z
    container_name: msa-minio
    restart: unless-stopped
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-msa_minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-msa_minio_password}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - msa-net

# ═════════════════════════════════════════════════════════════════════════════
# SECTION 2 — MESSAGING & DISCOVERY
# HOST PORTS: 19092 / 18500 / 18600 / 18200
# ═════════════════════════════════════════════════════════════════════════════

  # ── Kafka Event Streaming ─────────────────────────────────────────────────
  # Host: 19092  |  Container: 9092 (standard KRaft)
  # FIX: Added kafka_data volume for persistence
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: msa-kafka
    restart: unless-stopped
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'   # FIX: Use persistent volume path
      CLUSTER_ID: 'MsaAgentKRaftCluster001'
    volumes:
      - kafka_data:/var/lib/kafka/data          # FIX: Persist Kafka data across restarts
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - msa-net

  # ── Consul Service Discovery ──────────────────────────────────────────────
  # Host: 18500 (HTTP)  18600 (DNS)  |  Container: 8500 / 8600
  consul:
    image: hashicorp/consul:1.18
    container_name: msa-consul
    restart: unless-stopped
    ports:
      - "18500:8500"
      - "18600:8600/udp"
    command: "agent -dev -client=0.0.0.0 -ui"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/v1/status/leader"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - msa-net

  # ── HashiCorp Vault ───────────────────────────────────────────────────────
  # Host: 18200  |  Container: 8200 (standard)
  vault:
    image: hashicorp/vault:1.16
    container_name: msa-vault
    restart: unless-stopped
    ports:
      - "18200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:-msa-root-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - msa-net

# ═════════════════════════════════════════════════════════════════════════════
# SECTION 3 — MANDATORY AI STARTUP CHAIN
#
#  ollama-check ──▶ msa-llm-init ──▶ msa-rag-init ──▶ msa-agent 🚀
#
#  If Ollama (host.docker.internal:11434) is NOT running → CHAIN FAILS
#  Agent will NOT start until all 3 steps pass.
# ═════════════════════════════════════════════════════════════════════════════

  # ── STEP 1: ollama-check ─────────────────────────────────────────────────
  # Waits up to 5 min for Ollama on HOST. Hard-fails if unreachable.
  ollama-check:
    image: curlimages/curl:8.7.1
    container_name: msa-ollama-check
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "╔══════════════════════════════════════════╗"
        echo "║  STEP 1: Ollama Host Connectivity Check  ║"
        echo "║  Target: $$OLLAMA_BASE_URL               ║"
        echo "╚══════════════════════════════════════════╝"
        MAX=60; i=0
        until curl -sf "$$OLLAMA_BASE_URL/api/version" > /dev/null 2>&1; do
          i=$$((i+1))
          if [ $$i -ge $$MAX ]; then
            echo "✗ FATAL: Ollama not reachable after $${MAX} attempts (5min)."
            echo "  → Start Ollama on Windows: ollama serve"
            exit 1
          fi
          echo "  [$$i/$$MAX] Waiting for Ollama... (5s)"
          sleep 5
        done
        VER=$$(curl -sf "$$OLLAMA_BASE_URL/api/version" | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
        echo "  ✓ Ollama UP — version: $$VER"
        echo "  ✓ STEP 1 PASSED"
    networks:
      - msa-net

  # ── STEP 2: msa-llm-init ─────────────────────────────────────────────────
  # Pulls all 4 LLM models + runs a test generation. Hard-fails on error.
  msa-llm-init:
    image: curlimages/curl:8.7.1
    container_name: msa-llm-init
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      MSA_OLLAMA_MODEL: ${MSA_OLLAMA_MODEL:-qwen2.5:7b-instruct}
      MSA_OLLAMA_FAST_MODEL: ${MSA_OLLAMA_FAST_MODEL:-qwen2.5:0.5b}
      MSA_OLLAMA_REASON_MODEL: ${MSA_OLLAMA_REASON_MODEL:-deepseek-r1:7b}
      MSA_OLLAMA_EMBED_MODEL: ${MSA_OLLAMA_EMBED_MODEL:-nomic-embed-text:latest}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "╔══════════════════════════════════════════╗"
        echo "║  STEP 2: LLM Models Pull & Verify        ║"
        echo "╚══════════════════════════════════════════╝"
        HOST="$$OLLAMA_BASE_URL"; ERRORS=0
        pull_model() {
          MODEL="$$1"; ROLE="$$2"
          echo "  [$$ROLE] $$MODEL"
          FOUND=$$(curl -sf "$$HOST/api/tags" | grep -c "$$MODEL" || true)
          if [ "$$FOUND" -gt "0" ]; then
            echo "  ✓ Installed: $$MODEL"
          else
            echo "  ↓ Pulling $$MODEL ..."
            RESP=$$(curl -sf -X POST "$$HOST/api/pull" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$$MODEL\",\"stream\":false}" 2>&1 || echo "FAIL")
            if echo "$$RESP" | grep -qi "FAIL\|error"; then
              echo "  ✗ FAILED: $$MODEL"; ERRORS=$$((ERRORS+1))
            else
              echo "  ✓ Pulled: $$MODEL"
            fi
          fi
        }
        pull_model "$$MSA_OLLAMA_MODEL"        "Primary Reasoning LLM"
        pull_model "$$MSA_OLLAMA_FAST_MODEL"   "Fast LLM"
        pull_model "$$MSA_OLLAMA_REASON_MODEL" "Deep Reasoning LLM"
        pull_model "$$MSA_OLLAMA_EMBED_MODEL"  "Embedding Model (RAG)"
        echo ""
        echo "  Testing primary LLM response..."
        TEST=$$(curl -sf -X POST "$$HOST/api/generate" \
          -H "Content-Type: application/json" \
          -d "{\"model\":\"$$MSA_OLLAMA_MODEL\",\"prompt\":\"Say: MSA Agent Ready\",\"stream\":false}" \
          | grep -o '"response":"[^"]*"' | head -1 || echo "")
        if [ -z "$$TEST" ]; then
          echo "  ✗ LLM test response FAILED!"; ERRORS=$$((ERRORS+1))
        else
          echo "  ✓ LLM response: $$TEST"
        fi
        echo ""
        echo "  Installed models:"
        curl -sf "$$HOST/api/tags" | grep -o '"name":"[^"]*"' | \
          sed 's/"name":"//;s/"//' | while read m; do echo "    ✓ $$m"; done
        echo ""
        if [ $$ERRORS -gt 0 ]; then
          echo "✗ STEP 2 FAILED — $$ERRORS model(s) not ready"; exit 1
        fi
        echo "  ✓ STEP 2 PASSED — All LLMs ready"
    depends_on:
      ollama-check:
        condition: service_completed_successfully
    networks:
      - msa-net

  # ── STEP 3: msa-rag-init ─────────────────────────────────────────────────
  # Creates Qdrant collections, checks FAISS, warms embedding, verifies Neo4j.
  # Hard-fails (exit 1) if RAG pipeline is broken.
  msa-rag-init:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: msa-agent:latest
    container_name: msa-rag-init
    restart: "no"
    command: ["python3", "scripts/rag_healthcheck.py"]
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      MSA_OLLAMA_EMBED_MODEL: ${MSA_OLLAMA_EMBED_MODEL:-nomic-embed-text:latest}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      ENABLE_NEO4J: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-msa_neo4j_pass}
    volumes:
      - msa_data:/app/data
      - msa_indexes:/app/indexes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      msa-llm-init:
        condition: service_completed_successfully
    networks:
      - msa-net

# ═════════════════════════════════════════════════════════════════════════════
# SECTION 4 — AUTOMATION
# HOST PORT: 15678
# ═════════════════════════════════════════════════════════════════════════════

  # ── N8N Workflow Automation ───────────────────────────────────────────────
  # Host: 15678  |  Container: 5678 (standard N8N)
  # UI: http://localhost:15678  (admin / N8N_BASIC_AUTH_PASSWORD)
  n8n:
    image: n8nio/n8n:latest
    container_name: msa-n8n
    restart: unless-stopped
    ports:
      - "15678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-msa_n8n_pass}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-msa-n8n-encryption-key-change-me}
      N8N_HOST: "0.0.0.0"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      N8N_LOG_LEVEL: "info"
      WEBHOOK_URL: "http://localhost:15678"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: msa_n8n
      DB_POSTGRESDB_USER: msa_admin
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-msa_secure_password}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      N8N_TELEGRAM_CHAT_ID: ${N8N_TELEGRAM_CHAT_ID:-}
      N8N_EMAIL_MODE: smtp
      N8N_SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      N8N_SMTP_PORT: ${SMTP_PORT:-587}
      N8N_SMTP_USER: ${SMTP_USER:-}
      N8N_SMTP_PASS: ${SMTP_PASS:-}
      N8N_SMTP_SENDER: ${SMTP_USER:-}
      MSA_AGENT_URL: http://msa-agent:5000
      MSA_FASTAPI_URL: http://msa-agent:8000
      MSA_CAREER_URL: http://msa-career-api:8082
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5678/healthz || wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - msa-net

# ═════════════════════════════════════════════════════════════════════════════
# SECTION 5 — BACKEND SERVICES
# HOST PORTS: 10500 / 10800 / 10808 / 10801 / 10802 / 10803
# ═════════════════════════════════════════════════════════════════════════════

  # ── msa-agent — Core AI Agent ────────────────────────────────────────────
  # Flask Socket.IO  →  Host:10500  Container:5000
  # FastAPI Gateway  →  Host:10800  Container:8000
  # Modules: agent/, ai_core/, backend/, knowledge/, automation/,
  #          coding/, voice/, browser_agent/, vision/, memory/,
  #          embeddings/, prompts/, plugins/, tools/, shared/
  msa-agent:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: msa-agent:latest
    container_name: msa-agent
    restart: unless-stopped
    ports:
      - "10500:5000"    # Flask Socket.IO — http://localhost:10500
      - "10800:8000"    # FastAPI Docs    — http://localhost:10800/docs
    environment:
      FLASK_ENV: production
      PORT: "5000"
      FASTAPI_PORT: "8000"
      MSA_AUTO_APPROVE: "true"
      MSA_SECRET_KEY: ${MSA_SECRET_KEY:-msa-secret-key-change-in-production}
      MSA_API_KEY: ${MSA_API_KEY:-}
      MSA_USER_NAME: ${MSA_USER_NAME:-Md Sadique Amin}
      MSA_USER_EMAIL: ${MSA_USER_EMAIL:-}
      MSA_USER_PHONE: ${MSA_USER_PHONE:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:10080,http://localhost:10090,http://localhost:10500,http://localhost:10800}
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://msa_admin:${POSTGRES_PASSWORD:-msa_secure_password}@postgres:5432/msa_enterprise
      REDIS_URL: redis://redis:6379/0
      MSA_VECTOR_BACKEND: qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      ENABLE_NEO4J: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-msa_neo4j_pass}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      MSA_OLLAMA_MODEL: ${MSA_OLLAMA_MODEL:-qwen2.5:7b-instruct}
      MSA_OLLAMA_FAST_MODEL: ${MSA_OLLAMA_FAST_MODEL:-qwen2.5:0.5b}
      MSA_OLLAMA_REASON_MODEL: ${MSA_OLLAMA_REASON_MODEL:-deepseek-r1:7b}
      MSA_OLLAMA_EMBED_MODEL: ${MSA_OLLAMA_EMBED_MODEL:-nomic-embed-text:latest}
      MSA_OLLAMA_TIMEOUT: ${MSA_OLLAMA_TIMEOUT:-120}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN:-msa-root-token}
      CONSUL_HTTP_ADDR: http://consul:8500
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_USER:-msa_minio_user}
      MINIO_SECRET_KEY: ${MINIO_PASSWORD:-msa_minio_password}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_API_KEY: ${ADZUNA_API_KEY:-}
      JOOBLE_API_KEY: ${JOOBLE_API_KEY:-}
      JSEARCH_API_KEY: ${JSEARCH_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      N8N_TELEGRAM_CHAT_ID: ${N8N_TELEGRAM_CHAT_ID:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook
      MSA_AUTO_APPLY: ${MSA_AUTO_APPLY:-false}
      MSA_MAX_APPLY_PER_DAY: ${MSA_MAX_APPLY_PER_DAY:-20}
    volumes:
      - msa_data:/app/data
      - msa_models:/app/models
      - msa_uploads:/app/uploads
      - msa_indexes:/app/indexes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      vault:
        condition: service_healthy
      consul:
        condition: service_healthy
      ollama-check:
        condition: service_completed_successfully   # STEP 1
      msa-llm-init:
        condition: service_completed_successfully   # STEP 2
      msa-rag-init:
        condition: service_completed_successfully   # STEP 3
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || curl -sf http://localhost:5000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - msa-net

  # ── msa-gateway — API Gateway ─────────────────────────────────────────────
  # Host: 10808  |  Container: 8080
  msa-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.gateway
    image: msa-gateway:latest
    container_name: msa-gateway
    restart: unless-stopped
    ports:
      - "10808:8080"    # http://localhost:10808
    environment:
      MSA_AGENT_URL: http://msa-agent:5000
      MSA_FASTAPI_URL: http://msa-agent:8000
      MSA_AUTH_URL: http://msa-auth:8081
      MSA_CAREER_URL: http://msa-career-api:8082
      REDIS_URL: redis://redis:6379/1
      MSA_SECRET_KEY: ${MSA_SECRET_KEY:-msa-secret-key-change-in-production}
      CONSUL_HTTP_ADDR: http://consul:8500
    depends_on:
      msa-agent:
        condition: service_healthy
      msa-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - msa-net

  # ── msa-auth — Authentication & PDP ──────────────────────────────────────
  # Host: 10801  |  Container: 8081
  msa-auth:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.auth
    image: msa-auth:latest
    container_name: msa-auth
    restart: unless-stopped
    ports:
      - "10801:8081"    # http://localhost:10801
    environment:
      MSA_SECRET_KEY: ${MSA_SECRET_KEY:-msa-secret-key-change-in-production}
      USER_ADMIN_HASH: ${USER_ADMIN_HASH:-}
      USER_DEV_HASH: ${USER_DEV_HASH:-}
      BACKEND_URL: http://msa-agent:5000
      AUTH_SERVER_URL: http://msa-auth:8081
      DATABASE_URL: postgresql://msa_admin:${POSTGRES_PASSWORD:-msa_secure_password}@postgres:5432/msa_enterprise
      REDIS_URL: redis://redis:6379/2
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN:-msa-root-token}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - msa-net

  # ── msa-career-api — Career Intelligence API ──────────────────────────────
  # Host: 10802  |  Container: 8082
  # Docs: http://localhost:10802/docs
  msa-career-api:
    build:
      context: .
      dockerfile: Dockerfile.production
    image: msa-agent:latest
    container_name: msa-career-api
    restart: unless-stopped
    ports:
      - "10802:8082"    # http://localhost:10802/docs
    command: >
      python3 -c "
      import uvicorn;
      uvicorn.run('backend.career_api:app', host='0.0.0.0', port=8082, log_level='info')
      "
    environment:
      DATABASE_URL: postgresql://msa_admin:${POSTGRES_PASSWORD:-msa_secure_password}@postgres:5432/msa_enterprise
      REDIS_URL: redis://redis:6379/3
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      MSA_OLLAMA_MODEL: ${MSA_OLLAMA_MODEL:-qwen2.5:7b-instruct}
      MSA_OLLAMA_EMBED_MODEL: ${MSA_OLLAMA_EMBED_MODEL:-nomic-embed-text:latest}
      MSA_VECTOR_BACKEND: qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_API_KEY: ${ADZUNA_API_KEY:-}
      JOOBLE_API_KEY: ${JOOBLE_API_KEY:-}
      JSEARCH_API_KEY: ${JSEARCH_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      N8N_TELEGRAM_CHAT_ID: ${N8N_TELEGRAM_CHAT_ID:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook
      MSA_AUTO_APPLY: ${MSA_AUTO_APPLY:-false}
      MSA_MAX_APPLY_PER_DAY: ${MSA_MAX_APPLY_PER_DAY:-20}
    volumes:
      - msa_data:/app/data
      - msa_models:/app/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - msa-net

  # ── msa-config — Dynamic Config & Feature Flag Service ────────────────────
  # Host: 10803  |  Container: 8083
  # FIX: Was using uvicorn with wrong module path — config_service is Flask.
  #      Correct command: python config-service/config_service.py
  msa-config:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.config
    image: msa-config:latest
    container_name: msa-config
    restart: unless-stopped
    ports:
      - "10803:8083"    # http://localhost:10803
    environment:
      CONSUL_HTTP_ADDR: http://consul:8500
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN:-msa-root-token}
      REDIS_URL: redis://redis:6379/4
    depends_on:
      consul:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - msa-net

# ═════════════════════════════════════════════════════════════════════════════
# SECTION 6 — FRONTEND SERVICES
# HOST PORTS: 10080 / 10090
# ═════════════════════════════════════════════════════════════════════════════

  # ── msa-frontend — React/Vite Desktop Web UI ─────────────────────────────
  # Host: 10080  |  Nginx: 10080
  # Nginx proxies:
  #   /socket.io/ → msa-agent:5000   (Socket.IO)
  #   /api/       → msa-agent:8000   (FastAPI)
  #   /career/    → msa-career-api:8082
  #   /gateway/   → msa-gateway:8080
  # FIX: Pass build args properly; Dockerfile now copies nginx.conf correctly
  msa-frontend:
    build:
      context: ./frontend-desktop
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:10500}
        VITE_FASTAPI_URL: ${VITE_FASTAPI_URL:-http://localhost:10800}
    image: msa-frontend:latest
    container_name: msa-frontend
    restart: unless-stopped
    ports:
      - "10080:10080"   # http://localhost:10080
    depends_on:
      msa-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:10080/health || curl -sf http://localhost:10080/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - msa-net

  # ── msa-pwa — PWA / Mobile Web UI ────────────────────────────────────────
  # Host: 10090  |  Nginx: 10090
  # Source: ui/ (index.html, mobile_app.html, msa_voice.html, manifest.json)
  msa-pwa:
    image: nginx:1.25-alpine
    container_name: msa-pwa
    restart: unless-stopped
    ports:
      - "10090:10090"   # http://localhost:10090
    volumes:
      - ./ui:/usr/share/nginx/html:ro
      - ./infrastructure/nginx-pwa.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      msa-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:10090/health || curl -sf http://localhost:10090/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - msa-net

# ═════════════════════════════════════════════════════════════════════════════
# SECTION 7 — OBSERVABILITY
# HOST PORTS: 19090 / 13001
# ═════════════════════════════════════════════════════════════════════════════

  # ── Prometheus ────────────────────────────────────────────────────────────
  # Host: 19090  |  Container: 9090
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: msa-prometheus
    restart: unless-stopped
    ports:
      - "19090:9090"    # http://localhost:19090
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - msa-net

  # ── Grafana Dashboard ─────────────────────────────────────────────────────
  # Host: 13001  |  Container: 3000
  # Login: http://localhost:13001  (admin / GRAFANA_PASSWORD)
  grafana:
    image: grafana/grafana:10.4.2
    container_name: msa-grafana
    restart: unless-stopped
    ports:
      - "13001:3000"    # http://localhost:13001
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-msa_grafana_pass}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: "http://localhost:13001"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - msa-net
